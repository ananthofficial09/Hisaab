/* Layout: sticky header (brand, month stepper, theme) with scrollable tab chips; one column on phones, two-column charts on desktop. Savings is the single hero figure; everything else stays quiet. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E8EDEB; --line:#D5DDDA;
  --ink:#16231F; --ink-2:#4E5F59; --ink-3:#74847E;
  --accent:#0C6B58; --accent-ink:#FFFFFF; --accent-soft:#D6EDE6;
  --good:#157F4F; --warn:#8F5A00; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FADAD6;
  --c-income:#0C6B58; --c-expense:#C2603A; --c-save:#1F3A8A;
  --shadow:0 1px 2px rgba(22,35,31,.06),0 8px 24px rgba(22,35,31,.06);
  --radius:14px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#16211E; --surface-2:#1F2D29; --line:#2B3B36;
    --ink:#E8F1EE; --ink-2:#A9BAB3; --ink-3:#82958E;
    --accent:#3FBF9F; --accent-ink:#06231C; --accent-soft:#17382F;
    --good:#4CC38A; --warn:#E4B04A; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#3E1B18;
    --c-income:#3FBF9F; --c-expense:#E58A63; --c-save:#9DB2FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16211E; --surface-2:#1F2D29; --line:#2B3B36;
  --ink:#E8F1EE; --ink-2:#A9BAB3; --ink-3:#82958E;
  --accent:#3FBF9F; --accent-ink:#06231C; --accent-soft:#17382F;
  --good:#4CC38A; --warn:#E4B04A; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#3E1B18;
  --c-income:#3FBF9F; --c-expense:#E58A63; --c-save:#9DB2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand img{width:32px;height:32px;border-radius:8px;flex:none;display:block}
.brand small{font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.stepper{display:flex;align-items:center;gap:2px}
.stepper .lbl{min-width:118px;text-align:center;font-weight:600;font-size:15px}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.today-chip{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:12px;padding:3px 10px;color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.views{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;align-items:center;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.vlbl{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex:none;margin-right:2px}
.vchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.vchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.who{padding:12px 0;border-top:1px solid var(--line)}
.who:first-child{border-top:0}
.who .l{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:center}
.who .n{display:flex;align-items:center;gap:8px}
.small.neg{color:var(--bad);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center;font-weight:600}

/* layout */
main.in{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--ink-3);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;background:var(--accent-soft);border-radius:var(--radius);padding:10px 14px;font-size:13px}

/* hero */
.hero{padding:20px;box-shadow:var(--shadow)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.big{font-size:clamp(34px,9vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px;color:var(--accent);overflow-wrap:anywhere}
.big.neg{color:var(--bad)}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:18px}
.split i{display:block;height:100%}
.split .sp{background:var(--c-expense)}
.split .sv{background:var(--accent)}
.splitlbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.stats>div{padding-right:8px;min-width:0}
.stats>div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats b{display:block;font-size:clamp(14px,4.2vw,18px);font-weight:700;overflow-wrap:anywhere}
.stats span{font-size:12px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* buttons / forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}
.fld>span,.fld>legend{font-size:13px;font-weight:600;color:var(--ink-2);padding:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=radio],input[type=checkbox]{width:auto}
select{appearance:auto}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;min-height:120px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.search{position:relative;display:block}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:38px}
.filters{display:flex;flex-direction:column;gap:12px}
.filters summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px}
.chip input:checked+span{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:32px;height:32px;border-radius:50%;cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ferr{color:var(--bad);font-size:13px;font-weight:600}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 4px;border-radius:10px}
.row-main:hover{background:var(--surface-2)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-t small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);padding:14px 4px 6px;border-bottom:2px solid var(--line)}
.dayh:first-child{padding-top:2px}
.sumline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:4px;flex-wrap:wrap}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.brow{padding:12px 4px;flex:1;min-width:0}
.brow .l{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sw-tog{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;width:44px;height:26px;position:relative;padding:0;flex:none}
.sw-tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.sw-tog[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw-tog[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}
.cmp .n{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.cmp .v{text-align:right;line-height:1.2}
.cmp .v b{display:block}
.cmp .v small{color:var(--ink-3);font-size:12px}
.cmp.tot .n{font-weight:700}

/* charts */
svg.chart{width:100%;height:auto;display:block;max-width:600px;margin:0 auto}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink-3);font-size:10px;font-family:var(--font)}
.cn{fill:var(--ink);font-family:var(--font)}
.bar-exp{fill:var(--c-expense)}
.bar-inc{fill:var(--c-income)}
.ln-sav{stroke:var(--c-save);fill:none;stroke-width:2;stroke-linejoin:round}
.pt-sav{fill:var(--surface);stroke:var(--c-save);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:10px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.donutwrap svg{width:180px;height:180px;flex:none}
.dleg{list-style:none;margin:0;padding:0;flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.dleg li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dleg .pc{color:var(--ink-3);font-size:12px;min-width:34px;text-align:right}

/* floating add, toast, modal */
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);padding:14px 20px 14px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.fab:hover{filter:brightness(1.08)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;max-width:min(92vw,460px);font-size:14px;box-shadow:var(--shadow)}
#toast .link{color:var(--bg);text-decoration:underline}
.mback{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.55);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;padding:0}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .sub{color:var(--ink-2);font-size:13px;margin-bottom:12px}
.modal form{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
@media (min-width:640px){.mback{align-items:center;padding:24px}.modal{border-radius:20px;padding:24px}}
.panel{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.panel.bad{border-color:var(--bad);background:var(--bad-soft)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec+.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.sec h3{font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.gain{color:var(--good)}.loss{color:var(--bad)}.amt small{display:block;font-size:12px;text-align:right;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- tiny helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return n<10?'0'+n:''+n}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t}
function icon(n){var p={
 plus:'M12 5v14M5 12h14',edit:'M4 20h4l10-10-4-4L4 16v4zM13 7l4 4',

 sun:'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',

/* ---------- money (stored as integer paise) ---------- */
var nf0=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
var nf2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function inr(p){var a=Math.abs(p);var s=(a%100===0)?nf0.format(a/100):nf2.format(a/100);return (p<0?'−':'')+'₹'+s}
function trim1(n){return n.toFixed(1).replace(/\.0$/,'')}
function inrShort(p){var r=Math.abs(p)/100,s;
 if(r>=1e7)s=trim1(r/1e7)+'Cr';else if(r>=1e5)s=trim1(r/1e5)+'L';else if(r>=1e3)s=trim1(r/1e3)+'k';else s=String(Math.round(r));
 return (p<0?'−':'')+'₹'+s}
function parseAmt(v){v=String(v==null?'':v).replace(/[₹,\s]/g,'');if(!/^\d+(\.\d{1,2})?$/.test(v))return null;return Math.round(parseFloat(v)*100)}
function rupeesStr(p){return (p/100).toFixed(p%100?2:0)}

/* ---------- dates ---------- */
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function today(){return ymd(new Date())}
function curMonth(){return ym(new Date())}
function addMonths(m,n){return ym(new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1))}
function daysIn(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}
function monthLabel(m){return MN[+m.slice(5,7)-1]+' '+m.slice(0,4)}
function monthShort(m){return MN[+m.slice(5,7)-1].slice(0,3)}
function fmtDate(s){return s.slice(8,10)+' '+MN[+s.slice(5,7)-1].slice(0,3)+' '+s.slice(0,4)}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;return ymd(new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)))===s}
function dayLabel(d){var t=today(),y=new Date();y.setDate(y.getDate()-1);
 var w=d===t?'Today':d===ymd(y)?'Yesterday':WD[new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay()];
 return w+' · '+fmtDate(d)}

  if(!m||typeof m!=='object')return;

/* ---------- selectors / calculations ---------- */
function cat(id){return S.categories.filter(function(c){return c.id===id})[0]||{id:id,name:'Uncategorised',color:'#8C8C8C',budget:null}}

function monthExpenses(m,sc){return S.expenses.filter(function(e){return e.date.slice(0,7)===m&&inScope(e.who,sc)})}
function monthIncome(m,sc){return sum((S.income[m]||[]).filter(function(i){return inScope(i.who,sc)}),function(i){return i.amount})}

function daysElapsed(m){var c=curMonth();if(m<c)return daysIn(m);if(m>c)return 0;return new Date().getDate()}
function budgetNote(catId,m){

  var len=a.v/total*circ,dash=Math.max(0.5,len-(arr.length>1?2:0));
  segs+='<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+a.c.color+'" stroke-width="26" stroke-dasharray="'+dash.toFixed(2)+' '+(circ-dash).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 90 90)"><title>'+esc(a.c.name)+': '+inr(a.v)+'</title></circle>';
  acc+=len;

 for(i=0;i<n;i++){if(days[i]>0){var h=days[i]/sc.max*ph,x=L+i*slot+(slot-bw)/2;
  bars+='<rect x="'+x.toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" class="bar-exp"><title>'+fmtDate(m+'-'+pad(i+1))+': '+inr(days[i])+'</title></rect>'}}
 var xl=[1,5,10,15,20,25],lbl='';if(n-25>=4)xl.push(n);else if(n>25&&xl.indexOf(n)<0&&n-25>=3)xl.push(n);

function trendChart(m){
 var ms=[],i;for(i=5;i>=0;i--)ms.push(addMonths(m,-i));

 var any=data.some(function(d){return d.inc||d.exp});
 if(!any)return emptyState('No history yet','Add income and expenses to see the last six months side by side.');
 var hi=0,lo=0;data.forEach(function(d){hi=Math.max(hi,d.inc,d.exp,d.sav);lo=Math.min(lo,d.sav)});
 var sc=niceScale(hi-lo,4),step=sc.step,top=Math.ceil(hi/step-1e-9)*step,bot=lo<0?Math.floor(lo/step+1e-9)*step:0;

  pts.push([cx,Y(d.sav),d]);

 });

function cmpRow(label,cur,prev,goodUp,color,tot){

 else if(!prev)chip='<span class="pill">New</span>';
 else{var pc=Math.round(Math.abs(d)/Math.abs(prev)*100),up=d>0,cls=d===0?'':((up===goodUp)?'good':'bad');
  chip='<span class="pill '+cls+'">'+(d===0?'Same':(up?'▲ ':'▼ ')+pc+'%')+'</span>'}
 return '<li class="cmp'+(tot?' tot':'')+'"><span class="n">'+(color?'<i class="dot" style="background:'+color+'"></i>':'')+esc(label)+'</span><span class="v"><b>'+inr(cur)+'</b><small>was '+inr(prev)+'</small></span>'+chip+'</li>';
}
function compareCard(m){

 var c1=spendByCat(m),c0=spendByCat(pm),ids={};Object.keys(c1).concat(Object.keys(c0)).forEach(function(k){ids[k]=1});
 var rows=Object.keys(ids).sort(function(a,b){return (c1[b]||0)-(c1[a]||0)||(c0[b]||0)-(c0[a]||0)});
 return '<ul class="list">'+cmpRow('Income',t.inc,p.inc,true,'',true)+cmpRow('Expenses',t.exp,p.exp,false,'',true)+cmpRow('Savings',t.sav,p.sav,true,'',true)+

/* ---------- sample data ---------- */
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function catByName(n){var c=S.categories.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0];return (c||S.categories[0]).id}
function loadSample(){
 var rnd=seeded(11),m0=curMonth(),td=new Date().getDate();
 [['Nifty 50 index SIP','SIP',1500000,1634000,-2],['Blue-chip stocks','Stocks',2500000,2380000,-1],['Gold ETF','Gold',1000000,1125000,-1],['Fixed deposit','Fixed Deposit',2000000,2037000,0]].forEach(function(x){S.investments.push({id:uid(),name:x[0],type:x[1],invested:x[2],value:x[3],date:addMonths(m0,x[4])+'-02',who:OWNER,s:1})});
 function pick(a){return a[Math.floor(rnd()*a.length)]}
 function amt(lo,hi){return Math.round((lo+rnd()*(hi-lo))/10)*1000}
 var plan=[['Food',.55,120,650,['Lunch','Dinner out','Tea and snacks','Biryani','Cafe']],['Groceries',.28,500,1800,['Vegetables','Weekly groceries','Milk and eggs','Fruits']],
  ['Transport',.6,40,320,['Auto','Metro recharge','Fuel','Cab']],['Shopping',.05,700,3500,['Clothes','Home items','Online order']],['Health',.03,200,1500,['Pharmacy','Doctor visit']],
  ['Entertainment',.08,250,900,['Movie','Weekend outing']],['Other',.06,100,700,['Gift','Stationery','Repairs']]];
 S.recurring.push({id:uid(),name:'Rent',amount:1500000,catId:catByName('Rent'),day:1,active:true,start:addMonths(m0,-2),s:1},
  {id:uid(),name:'Internet and mobile',amount:79900,catId:catByName('Bills & Utilities'),day:5,active:true,start:addMonths(m0,-2),s:1},
  {id:uid(),name:'Streaming',amount:64900,catId:catByName('Entertainment'),day:8,active:true,start:addMonths(m0,-2),s:1});
 for(var k=-2;k<=0;k++){
  var m=addMonths(m0,k),last=k===0?td:daysIn(m),free=[800000,1200000,650000][k+2];
  S.income[m]=(S.income[m]||[]).concat([{id:uid(),name:'Salary',amount:6200000,s:1},{id:uid(),name:'Freelance',amount:free,s:1}]);
  for(var d=1;d<=last;d++){plan.forEach(function(p){if(rnd()<p[1])S.expenses.push({id:uid(),date:m+'-'+pad(d),amount:amt(p[2],p[3]),catId:catByName(p[0]),note:pick(p[4]),s:1})})}
  if(last>=12)S.expenses.push({id:uid(),date:m+'-12',amount:120000,catId:catByName('Education'),note:'Online course',s:1});
  ensureRecurring(m);
 }
 save();
}

/* ---------- download / copy ---------- */
function download(name,text,mime){
 try{var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},2000);
  toast('Download started. If nothing appears, use the Copy button instead.')}catch(e){toast('Download is blocked here. Use the Copy button instead.')}
}
function copyText(text,label){
 function fallback(){var d=$('#expBox'),t=$('#exp_text');if(d&&t){d.open=true;t.value=text;t.focus();t.select()}toast('Copy was blocked. Select the text shown below and copy it.')}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(label+' copied.')},fallback)}else fallback()}catch(e){fallback()}
}

var actions={
 'month-prev':function(){month=addMonths(month,-1);render()},
 'month-next':function(){month=addMonths(month,1);render()},
 'month-today':function(){month=curMonth();render()},
 'theme-toggle':function(){S.theme=isDark()?'light':'dark';applyTheme();save();render()},
 'theme-set':function(id){S.theme=id;applyTheme();save();render()},
 'add-exp':function(){expenseModal()},
 'edit-exp':function(id){expenseModal(id)},
 'del-exp':function(id){var i=S.expenses.findIndex(function(x){return x.id===id});if(i<0)return;var it=S.expenses.splice(i,1)[0];save();render();
  toast('Expense deleted.',function(){S.expenses.splice(Math.min(i,S.expenses.length),0,it);save();render()})},
 'add-inv':function(){invModal()},
 'edit-inv':function(id){invModal(id)},
 'del-inv':function(id){var i=S.investments.findIndex(function(x){return x.id===id});if(i<0)return;var it=S.investments.splice(i,1)[0];save();render();toast('Investment deleted.',function(){S.investments.splice(Math.min(i,S.investments.length),0,it);save();render()})},
 'add-inc':function(){incomeModal()},
 'edit-inc':function(id){incomeModal(id)},
 'del-inc':function(id){var arr=S.income[month]||[],i=arr.findIndex(function(x){return x.id===id});if(i<0)return;var it=arr.splice(i,1)[0];if(!arr.length)delete S.income[month];save();render();
  toast('Income deleted.',function(){(S.income[month]=S.income[month]||[]).splice(i,0,it);save();render()})},
 'copy-inc':function(){var pm=addMonths(month,-1),src=(S.income[pm]||[]).filter(function(x){return inScope(x.who)});if(!src.length)return;S.income[month]=(S.income[month]||[]).concat(src.map(function(x){return {id:uid(),name:x.name,amount:x.amount,who:x.who||OWNER,s:x.s}}));save();render();toast('Copied income from '+monthLabel(pm)+'. Edit any amounts that changed.')},
 'add-cat':function(){catModal()},
 'edit-cat':function(id){catModal(id)},
 'del-cat':function(id){deleteCatFlow(id)},
 'add-rec':function(){recModal()},
 'edit-rec':function(id){recModal(id)},
 'toggle-rec':function(id){var r=S.recurring.filter(function(x){return x.id===id})[0];if(!r)return;r.active=!r.active;if(r.active)r.start=curMonth();save();render();toast(r.name+(r.active?' resumed from this month.':' paused.'))},
 'del-rec':function(id){var i=S.recurring.findIndex(function(x){return x.id===id});if(i<0)return;var it=S.recurring.splice(i,1)[0];save();render();toast('Recurring expense deleted. Past entries were kept.',function(){S.recurring.splice(Math.min(i,S.recurring.length),0,it);save();render()})},
 'view-set':function(id){S.scope=id;save();render()},
 'add-mem':function(){memberModal()},
 'edit-mem':function(id){memberModal(id)},
 'del-mem':function(id){deleteMemberFlow(id)},
 'filters-clear':function(){F={q:'',cat:'',from:'',to:'',min:'',max:'',scope:'month'};render()},
 'toast-undo':function(){var f=undoFn;undoFn=null;$('#toast').hidden=true;if(f)f()},
 'modal-close':function(){closeModal()},
 'modal-back':function(id,t,e){if(e.target===t)closeModal()},
 'welcome-sample':function(){closeModal(true);S.welcomed=true;loadSample();render();toast('Sample data loaded. Clear it any time in Settings.')},
 'welcome-fresh':function(){closeModal()},
 'export-json':function(){download('hisaab-backup-'+today()+'.json',backupText(),'application/json')},
 'copy-json':function(){copyText(backupText(),'Backup')},
 'export-csv':function(){download('hisaab-expenses-'+today()+'.csv',csvText(),'text/csv')},
 'copy-csv':function(){copyText(csvText(),'Expenses CSV')},
 'import-check':function(){
  var txt=($('#imp_text').value||'').trim();
  if(!txt){importInfo={error:'Choose a backup file or paste the backup text first.'};render();return}
  try{var r=sanitize(JSON.parse(txt));importInfo=r.ok?{state:r.state}:{error:r.error}}catch(e){importInfo={error:'That text is not valid JSON. Make sure you copied the whole backup.'}}
  var keep=$('#imp_text')?txt:'';render();var t=$('#imp_text');if(t)t.value=keep},
 'import-apply':function(){if(!importInfo||!importInfo.state)return;var th=S.theme;S=importInfo.state;S.theme=th;S.welcomed=true;importInfo=null;save();render();toast('Backup restored.')},
 'import-cancel':function(){importInfo=null;render()},
 'sample-load':function(){loadSample();render();toast('Sample data loaded.')},
 'sample-clear':function(){clearSample();render();toast('Sample data cleared.')},
 'reset-start':function(){resetOpen=true;render()},
 'reset-cancel':function(){resetOpen=false;render()},
 'reset-confirm':function(){var th=S.theme;S=freshState();S.theme=th;S.welcomed=true;resetOpen=false;importInfo=null;save();render();toast('All data deleted.')}
};
document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
 var fn=actions[t.getAttribute('data-act')];if(fn)fn(t.getAttribute('data-id'),t,e);
});
function refreshList(){
 var l=$('#expList');if(l)l.innerHTML=listHtml();
 var c=$('#fl_clear');if(c)c.hidden=!filtersActive();
}
function onFilter(e){
 var id=e.target.id;if(!id||id.indexOf('fl_')!==0)return;
 var map={fl_q:'q',fl_cat:'cat',fl_scope:'scope',fl_from:'from',fl_to:'to',fl_min:'min',fl_max:'max'};
 if(map[id]){F[map[id]]=e.target.value;refreshList()}
}
document.addEventListener('input',onFilter);
document.addEventListener('change',function(e){
 onFilter(e);
 if(e.target.id==='rst_ok'){$('#rstBtn').disabled=!e.target.checked}
 if(e.target.id==='imp_file'&&e.target.files&&e.target.files[0]){
  var fr=new FileReader();fr.onload=function(){var t=$('#imp_text');if(t){t.value=String(fr.result||'');actions['import-check']()}};fr.onerror=function(){toast('Could not read that file.')};fr.readAsText(e.target.files[0]);
 }
});
document.addEventListener('keydown',function(e){
 if(!modalState)return;
 if(e.key==='Escape'){closeModal();return}
 if(e.key==='Tab'){
  var f=[].slice.call(document.querySelectorAll('.modal input:not([disabled]),.modal select,.modal button,.modal textarea')).filter(function(x){return x.offsetParent!==null||x.type==='radio'});
  if(!f.length)return;var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
 }
});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
S=load();applyTheme();$('#storeBanner').hidden=storageOk;
if(window.__HISAAB_TEST)window.__HISAAB_TEST({S:function(){return S},views:views,sanitize:sanitize,loadSample:loadSample,clearSample:clearSample,inr:inr,parseAmt:parseAmt,totals:totals,ensureRecurring:ensureRecurring,backupText:backupText,csvText:csvText,setMonth:function(m){month=m},setView:function(v){view=v},actions:actions,addMonths:addMonths,compareCard:compareCard,trendChart:trendChart,dailyChart:dailyChart,donut:donut,freshState:freshState,setS:function(x){S=x},setScope:function(s){S.scope=s},member:member,inScope:inScope,whoCard:whoCard,membersCard:membersCard,renderViews:renderViews});
route();
if(!S.welcomed)welcome();
})();
</script>
